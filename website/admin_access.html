<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinSight Access Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#f6f7fb;color:#182033;margin:0;padding:24px}
main{max-width:1000px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 8px 28px #0001}
button{padding:8px 12px;margin:4px;border:0;border-radius:8px;cursor:pointer;background:#3438d0;color:white}
button:disabled{opacity:.5;cursor:wait}button#signout{background:#b42318}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}
#msg{margin:12px 0}.muted{color:#667085;font-size:.9rem}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.nav a{display:inline-block;padding:9px 13px;border-radius:8px;text-decoration:none;background:#eef0ff;color:#3438d0;font-weight:600}
</style>
</head>
<body><main><h1>FinSight Access Management</h1><div class="nav"><a href="/">← Back to Home</a><a href="sign_in.html?return=admin_access.html" id="signin-link">Sign in again</a><button id="signout" type="button">Sign out</button></div><p id="identity" class="muted"></p><p id="msg">Checking administrator access…</p>
<table id="requests-table" hidden><thead><tr><th>Email</th><th>Status</th><th>Requested / updated</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
(async()=>{
const msg=document.getElementById('msg'),rows=document.getElementById('rows'),table=document.getElementById('requests-table'),identity=document.getElementById('identity');
const client=window.supabaseClient;
const signout=document.getElementById('signout');
signout.addEventListener('click',async()=>{
  signout.disabled=true;signout.textContent='Signing out…';
  try{
    if(client) await client.auth.signOut({scope:'global'});
  }catch(e){console.error('Supabase sign-out failed:',e);}
  try{sessionStorage.removeItem('finsight_access_token');}catch(e){}
  location.replace('/sign_in.html');
});
if(!client){msg.textContent='Supabase client could not be initialized. Use the sign-in link above.';return;}
let session=null;
try {
  let result=await client.auth.getSession(); session=result.data?.session;
  if(session && session.expires_at && session.expires_at*1000<Date.now()+60000){
    const refreshed=await client.auth.refreshSession(); session=refreshed.data?.session||null;
  }
} catch(e){ session=null; }
if(!session){msg.textContent='Your login session is invalid or expired. Please sign in again using the button above.';return;}
const API_BASE=location.origin;
const call=async(path,opts={})=>{
  // Refresh close-to-expiry tokens before each API call and retry once on 401.
  let current=(await client.auth.getSession()).data?.session;
  if(!current){const rr=await client.auth.refreshSession();current=rr.data?.session||null;}
  if(!current)throw new Error('Your login session is invalid or expired. Please sign in again.');
  const requestOnce=async(s)=>fetch(API_BASE+path,{...opts,headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json',...(opts.headers||{})}});
  let r=await requestOnce(current),d=await r.json().catch(()=>({}));
  if(r.status===401){
    const rr=await client.auth.refreshSession();current=rr.data?.session||null;
    if(current){r=await requestOnce(current);d=await r.json().catch(()=>({}));}
  }
  if(!r.ok)throw new Error(d.error||d.message||'Request failed ('+r.status+')');
  return d;
};
try{
const access=await call('/api/access/status');
if(!access.is_admin){msg.textContent='Forbidden: this signed-in account is not configured as a FinSight administrator.';return;}
const latest=(await client.auth.getSession()).data?.session||session;
identity.textContent='Administrator session: '+(latest.user.email||latest.user.id);
const d=await call('/api/admin/access-requests');
msg.textContent=d.requests.length?'Access requests ('+d.requests.length+')':'No access requests currently.';
table.hidden=false;
for(const item of d.requests){
const tr=document.createElement('tr'),email=document.createElement('td'),status=document.createElement('td'),updated=document.createElement('td'),actions=document.createElement('td');
email.textContent=item.email||item.user_id;status.textContent=item.status;updated.textContent=item.updated_at||item.created_at||'—';
for(const action of ['approve','reject','revoke']){
const b=document.createElement('button');b.textContent=action;b.disabled=(action==='approve'&&item.status==='approved')||(action==='reject'&&item.status==='rejected')||(action==='revoke'&&item.status==='revoked');
b.onclick=async()=>{if(!confirm('Are you sure you want to '+action+' access for '+(item.email||item.user_id)+'?'))return;b.disabled=true;msg.textContent='Updating access…';try{await call('/api/admin/access-requests/'+encodeURIComponent(item.user_id)+'/'+action,{method:'POST'});msg.textContent='Access '+action+'d successfully. Refreshing…';location.reload();}catch(e){msg.textContent=e.message;b.disabled=false;}};
actions.appendChild(b);
}
tr.append(email,status,updated,actions);rows.appendChild(tr);
}
}catch(e){msg.textContent=e.message+' Use the sign-in link above if your session needs renewal.';}
})();
</script></body></html>
